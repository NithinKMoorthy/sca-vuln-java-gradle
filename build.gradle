plugins { id 'java' }
group = 'demo'
version = '1.0.0'
repositories { mavenCentral() }
dependencies {
    implementation 'org.apache.struts:struts2-core:2.3.30'
    implementation 'com.google.guava:guava:20.0'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.60'
    implementation 'io.netty:netty-codec-http:4.1.42.Final'
    implementation 'com.thoughtworks.xstream:xstream:1.4.10'
    implementation 'org.apache.tomcat.embed:tomcat-embed-core:9.0.30'
    implementation 'com.google.code.gson:gson:2.8.5'
}
